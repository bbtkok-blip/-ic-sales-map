<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>株式会社IC 営業MAP</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1017;--panel:#111925;--line:#263243;--text:#f7f9fc;--muted:#96a2b3;--gold:#f1c340;--green:#43d18f;--blue:#5ba7ff;--purple:#a97cff;--red:#ff6969}
*{box-sizing:border-box}html,body,#app,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#0b1017,#101b29)}.card{width:min(92vw,430px);background:#101823;border:1px solid var(--line);border-radius:24px;padding:22px}.brand{color:var(--gold);font-weight:900;letter-spacing:.16em}.card h1{margin:12px 0 4px}.card p,.tiny{color:var(--muted);font-size:12px;line-height:1.5}.card input,.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#0b1017;color:#fff}.card input{margin-top:10px}.card button,.save{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--gold);color:#151515;font-weight:900}
#app{position:relative}#map{width:100%}.top{position:absolute;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 28px;background:linear-gradient(180deg,rgba(11,16,23,.99),rgba(11,16,23,.82),rgba(11,16,23,0));pointer-events:none}.count{font-size:62px;font-weight:900;line-height:.95}.subtitle{font-size:12px;color:#d4dae3;margin-top:6px}.user{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 12px);font-size:11px;text-align:right;color:#d4dae3}
.tabs{position:absolute;z-index:1002;left:10px;right:10px;top:157px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.tab{padding:9px;border:1px solid var(--line);border-radius:11px;background:#111925;color:#cbd3dd;font-weight:800;font-size:12px}.tab.active{background:var(--gold);color:#151515}
.side{position:absolute;z-index:1002;right:12px;bottom:142px;display:flex;flex-direction:column;gap:9px}.round{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:#111925;color:#fff;font-size:20px}.bottom{position:absolute;z-index:1002;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(0deg,rgba(11,16,23,.99),rgba(11,16,23,.82),rgba(11,16,23,0))}.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.action{padding:11px;border:1px solid var(--line);border-radius:12px;background:#111925;color:#fff;font-weight:800;font-size:12px}
.search{display:none;position:absolute;z-index:1003;top:202px;left:12px;right:82px}.search input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#111925;color:#fff}
.panel{display:none;position:absolute;z-index:2100;left:8px;right:8px;bottom:8px;max-height:91vh;overflow:auto;background:#101823;border:1px solid var(--line);border-radius:22px;padding:15px}.close{float:right;background:none;border:0;color:#fff;font-size:25px}.panel h2{margin:0 0 12px}.panel h3{color:#f5d56d;font-size:15px;margin:18px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:8px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field textarea{min-height:70px;resize:vertical}.section{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px;background:#0d141d}.section b{display:block;margin-bottom:8px}.danger{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px solid #6c3e44;background:#261719;color:#ffb6bb;font-weight:800}
.popup h3{margin:0 0 5px}.popup .meta{font-size:12px;color:#697587}.popup .memo{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px solid #eee}
.manage-row{display:grid;grid-template-columns:26px 1fr;gap:8px;border:1px solid var(--line);padding:9px;border-radius:10px;margin:7px 0}.filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-actions button{padding:10px;border-radius:11px;border:1px solid var(--line);font-weight:800}.secondary{background:#172331;color:#fff}.primary{background:var(--gold);color:#151515}.account-row{border:1px solid var(--line);padding:9px;border-radius:10px;margin:7px 0;background:#0c121a}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="card">
    <div class="brand">株式会社IC SALES MAP</div>
    <h1 id="authTitle">ログイン</h1>
    <p id="authDesc">会社共通の営業データにログインします。</p>
    <input id="authName" class="hidden" placeholder="表示名">
    <input id="authEmail" type="email" placeholder="メールアドレス">
    <input id="authPass" type="password" placeholder="パスワード">
    <button onclick="authMain()" id="authBtn">ログイン</button>
    <div id="authMsg" class="tiny"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="map"></div><div id="mapBusy" style="display:none;position:absolute;z-index:1100;left:50%;top:215px;transform:translateX(-50%);background:rgba(11,16,23,.92);color:#fff;border:1px solid #263243;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800">地図更新中...</div>
  <div class="top">
    <div class="brand">株式会社IC SALES MAP</div>
    <div class="count"><span id="count">0</span><span style="font-size:22px"> 社</span></div>
    <div class="subtitle">共有DB / メーカー・販売店検索対応</div>
    <div id="userMini" class="user"></div>
  </div>
  <div class="tabs">
    <button id="t1" class="tab active" onclick="setCategory('飛び込みリスト')">飛び込み</button>
    <button id="t2" class="tab" onclick="setCategory('見込')">見込</button>
    <button id="t3" class="tab" onclick="setCategory('顧客')">顧客</button>
  </div>
  <div id="searchBox" class="search"><input id="searchInput" placeholder="会社名・社長名・メーカー・販売店で検索"></div>
  <div class="side">
    <button class="round" onclick="toggleSearch()">⌕</button>
    <button class="round" onclick="openPanel('filterPanel')">⚙</button>
    <button class="round" onclick="locateMe()">◎</button>
    <button class="round" onclick="fitAll()">▦</button>
    <button class="round" onclick="openForm()">＋</button>
    <button class="round" onclick="openManage()">☰</button>
    <button class="round" onclick="openAccount()">♙</button>
  </div>
  <div class="bottom">
    <div class="bar">
      <button class="action" onclick="document.getElementById('excelFile').click()">Excel読込</button>
      <button class="action" onclick="downloadTemplate()">ひな形</button>
      <button class="action" onclick="exportExcel()">Excel出力</button>
    </div>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" style="display:none">
  </div>

  <div id="formPanel" class="panel">
    <button class="close" onclick="closePanel('formPanel')">×</button><h2 id="formTitle">営業先登録</h2>
    <input id="editId" type="hidden">
    <div class="field"><label>分類</label><select id="fCategory"><option>飛び込みリスト</option><option>見込</option><option>顧客</option></select></div>
    <div class="grid"><div class="field"><label>会社名</label><input id="fName"></div><div class="field"><label>業種</label><input id="fIndustry"></div></div>
    <div class="field"><label>住所</label><input id="fAddress"></div>
    <div class="grid"><div class="field"><label>社長名</label><input id="fPresident"></div><div class="field"><label>社長携帯</label><input id="fPresidentMobile"></div></div>
    <div class="grid"><div class="field"><label>会社電話</label><input id="fPhone"></div><div class="field"><label>担当者</label><input id="fStaff"></div></div>
    <div class="grid"><div class="field"><label>ステータス</label><select id="fStatus"><option>未訪問</option><option>訪問済</option><option>アポ</option><option>商談</option><option>契約</option><option>NG</option></select></div><div class="field"><label>最終訪問日</label><input id="fDate" type="date"></div></div>
    <div class="field"><label>営業ネタ</label><textarea id="fNeta"></textarea></div>
    <div class="field"><label>次回アクション</label><textarea id="fNext"></textarea></div>
    <h3>設備情報</h3><div id="equipRoot"></div>
    <div class="grid"><div class="field"><label>緯度</label><input id="fLat"></div><div class="field"><label>経度</label><input id="fLng"></div></div>
    <button class="save" onclick="saveCompany()">保存</button>
    <button id="deleteBtn" class="danger hidden" onclick="deleteCurrent()">この営業先を削除</button>
  </div>

  <div id="filterPanel" class="panel">
    <button class="close" onclick="closePanel('filterPanel')">×</button><h2>詳細検索</h2>
    <div class="field"><label>対象設備</label><select id="filterType"><option value="all">すべて</option><option value="phone_equipment">電話機</option><option value="copier_equipment">複合機</option><option value="camera_equipment">防犯カメラ</option><option value="security_equipment">警備</option><option value="utm_equipment">UTM</option><option value="server_equipment">サーバー</option></select></div>
    <div class="grid"><div class="field"><label>メーカー</label><input id="filterManufacturer"></div><div class="field"><label>販売店</label><input id="filterVendor"></div></div>
    <div class="grid"><div class="field"><label>有無</label><select id="filterPresence"><option value="">指定なし</option><option>有り</option><option>無し</option></select></div><div class="field"><label>契約</label><select id="filterAcquisition"><option value="">指定なし</option><option>リース</option><option>買取</option></select></div></div>
    <div class="filter-actions"><button class="primary" onclick="applyFilters()">絞り込む</button><button class="secondary" onclick="clearFilters()">クリア</button></div>
  </div>

  <div id="managePanel" class="panel">
    <button class="close" onclick="closePanel('managePanel')">×</button><h2>案件削除</h2>
    <div id="manageList"></div>
    <button class="danger" onclick="deleteSelected()">選択した案件を削除</button>
    <button class="danger" onclick="deleteAll()">全部削除（管理者）</button>
  </div>

  <div id="accountPanel" class="panel">
    <button class="close" onclick="closePanel('accountPanel')">×</button><h2>アカウント</h2>
    <div id="accountMe" class="account-row"></div>
    <button class="danger" onclick="logout()">ログアウト</button>
    <div id="adminArea" class="hidden">
      <h3>社員アカウント追加</h3>
      <div class="field"><label>表示名</label><input id="newName"></div>
      <div class="field"><label>メール</label><input id="newEmail"></div>
      <div class="field"><label>初期パスワード</label><input id="newPass" type="password"></div>
      <div class="field"><label>権限</label><select id="newRole"><option value="member">一般</option><option value="admin">管理者</option></select></div>
      <button class="save" onclick="createUser()">アカウント追加</button>
      <h3>登録ユーザー</h3><div id="profilesList"></div>
    </div>
  </div>
</div>

<script>
const sb=supabase.createClient("https://uujvndgimcllgbllvoan.supabase.co","sb_publishable_V5MqfEfTSZsyHo_6yCQE4A_jShjBVvR");
const EQUIP={
 phone_equipment:{label:'電話機',manufacturers:['家電','NTT','サクサ','ナカヨ','その他'],presence:false},
 copier_equipment:{label:'複合機',manufacturers:['シャープ','京セラ','ムラテック','キヤノン','リコー','富士フイルムBI（ゼロックス）','東芝','NTT','家電','その他'],presence:false},
 camera_equipment:{label:'防犯カメラ',manufacturers:['NSS','その他'],presence:true},
 security_equipment:{label:'警備',manufacturers:['ALSOK','セコム','その他'],presence:true},
 utm_equipment:{label:'UTM',manufacturers:['NTT','サクサ','その他'],presence:true},
 server_equipment:{label:'サーバー',manufacturers:['NEC','富士通','DELL','HP','その他'],presence:true}
};
let activeCategory='飛び込みリスト',companies=[],markers=[],session=null,profile=null;
let filters={type:'all',manufacturer:'',vendor:'',presence:'',acquisition:''};
const canvasRenderer=L.canvas({padding:0.5});const map=L.map('map',{zoomControl:false,preferCanvas:true,renderer:canvasRenderer}).setView([34.5,135.5],6);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル'}).addTo(map);

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openPanel(id){$ (id).style.display='block'} function closePanel(id){$ (id).style.display='none'}

async function init(){
 const {data:setup}=await sb.rpc('initial_setup_available');
 if(setup){$('authTitle').textContent='最初の管理者登録';$('authDesc').textContent='最初の1人が管理者になります。';$('authName').classList.remove('hidden');$('authBtn').textContent='管理者登録'}
 const {data:{session:s}}=await sb.auth.getSession(); if(s) await enter(s);
}
async function authMain(){
 const email=$('authEmail').value.trim(),password=$('authPass').value,name=$('authName').value.trim();
 $('authMsg').textContent='確認中...';
 $('authBtn').disabled=true;
 try{
   const {data:setup,error:setupError}=await sb.rpc('initial_setup_available');
   if(setupError) throw setupError;
   const res=setup?await sb.auth.signUp({email,password,options:{data:{display_name:name}}}):await sb.auth.signInWithPassword({email,password});
   if(res.error){$('authMsg').textContent='ログインできません：'+res.error.message;return}
   if(res.data.session){$('authMsg').textContent='ログイン成功。営業MAPを開いています...';await enter(res.data.session)}
   else $('authMsg').textContent='確認メールが届いた場合は確認後ログインしてください。';
 }catch(e){$('authMsg').textContent='通信エラー：'+(e?.message||'不明なエラー')}
 finally{$('authBtn').disabled=false}
}
async function enter(s){
 session=s;
 const {data,error}=await sb.from('profiles').select('*').eq('id',s.user.id).single();
 if(error){$('authMsg').textContent='プロフィール取得エラー：'+error.message;return}
 profile=data;
 $('auth').classList.add('hidden');
 $('app').classList.remove('hidden');
 $('userMini').innerHTML=`${esc(profile.display_name||profile.email)}<br>${profile.role==='admin'?'管理者':'一般'}`;
 buildEquip();
 setTimeout(()=>map.invalidateSize(true),40);
 await loadCompanies(true);
 subscribe();
 setTimeout(()=>map.invalidateSize(true),220);
}
async function logout(){await sb.auth.signOut();location.reload()}

let fetchSeq=0;
let mapFetchTimer=null;
let searchTimer=null;
let lastFetchKey='';
let realtimeTimer=null;

function currentBoundsForQuery(){
  const b=map.getBounds();
  const pad=0.12;
  const latSpan=Math.max(0.02,b.getNorth()-b.getSouth());
  const lngSpan=Math.max(0.02,b.getEast()-b.getWest());
  return {
    minLat:b.getSouth()-latSpan*pad,
    maxLat:b.getNorth()+latSpan*pad,
    minLng:b.getWest()-lngSpan*pad,
    maxLng:b.getEast()+lngSpan*pad
  };
}
function queryLimitForZoom(){
  const z=map.getZoom();
  if(z<=7)return 1200;
  if(z<=10)return 1800;
  if(z<=13)return 2500;
  return 3500;
}
function activeSearchText(){
  return $('searchInput').value.trim();
}
async function loadCompanies(force=false){
  if(!session)return;
  const b=currentBoundsForQuery();
  const params={
    p_category:activeCategory,
    p_min_lat:b.minLat,p_max_lat:b.maxLat,p_min_lng:b.minLng,p_max_lng:b.maxLng,
    p_query:activeSearchText(),
    p_equipment_type:filters.type||'all',
    p_manufacturer:filters.manufacturer||'',
    p_vendor:filters.vendor||'',
    p_presence:filters.presence||'',
    p_acquisition:filters.acquisition||'',
    p_limit:queryLimitForZoom()
  };
  const key=JSON.stringify(params);
  if(!force&&key===lastFetchKey)return;
  lastFetchKey=key;
  const seq=++fetchSeq;
  const busy=$('mapBusy'); if(busy)busy.style.display='block';
  const {data,error}=await sb.rpc('get_sales_map_rows',params);
  if(seq!==fetchSeq)return;
  if(busy)busy.style.display='none';
  if(error){console.error(error);$('authMsg').textContent='データ取得エラー：'+error.message;return}
  companies=data||[];
  render();
}
function scheduleMapFetch(delay=180){
  clearTimeout(mapFetchTimer);
  mapFetchTimer=setTimeout(()=>loadCompanies(false),delay);
}
function subscribe(){
  sb.channel('sales-live-v7')
    .on('postgres_changes',{event:'*',schema:'public',table:'sales_accounts'},payload=>{
      const row=payload.new||payload.old;
      if(!row)return;
      if(row.category!==activeCategory && payload.eventType!=='DELETE')return;
      clearTimeout(realtimeTimer);
      realtimeTimer=setTimeout(()=>loadCompanies(true),220);
    })
    .subscribe();
}
async function setCategory(c){
  activeCategory=c;
  ['t1','t2','t3'].forEach(x=>$(x).classList.remove('active'));
  $(c==='飛び込みリスト'?'t1':c==='見込'?'t2':'t3').classList.add('active');
  lastFetchKey='';
  companies=[];
  render();
  await loadCompanies(true);
}
function color(s){return s==='訪問済'?'#43d18f':(s==='アポ'||s==='商談')?'#5ba7ff':s==='契約'?'#a97cff':s==='NG'?'#ff6969':'#f1c340'}
function render(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const r=companies;
  const z=map.getZoom();
  const radius=z>=15?7:z>=12?6:z>=9?5:4;
  r.forEach(c=>{
    if(!Number.isFinite(+c.lat)||!Number.isFinite(+c.lng))return;
    const co=color(c.status);
    const m=L.circleMarker([+c.lat,+c.lng],{
      renderer:canvasRenderer,radius,weight:1.5,color:'#fff',fillColor:co,fillOpacity:1
    }).addTo(map);
    m.bindPopup(`<div class="popup"><h3>${esc(c.name)}</h3><div class="meta">${esc(c.address||'')}</div><div class="meta">社長:${esc(c.president_name||'-')} / ${esc(c.president_mobile||'-')}</div><div class="memo">${Object.entries(EQUIP).map(([k,v])=>{const e=c[k]||{},man=e.manufacturer==='その他'?e.custom_manufacturer:e.manufacturer;return (man||e.vendor||e.presence==='無し')?`${v.label}：${e.presence==='無し'?'無し':(man||'-')+' / '+(e.vendor||'-')}`:''}).filter(Boolean).join('<br>')}</div><button onclick="editCompany('${c.id}')" style="width:100%;margin-top:8px;padding:8px">編集</button></div>`);
    markers.push(m);
  });
  $('count').textContent=r.length;
}
function fitAll(){if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.18))}
map.on('moveend zoomend',()=>scheduleMapFetch(180));
window.addEventListener('resize',()=>setTimeout(()=>{map.invalidateSize(false);scheduleMapFetch(120)},120));
window.addEventListener('orientationchange',()=>setTimeout(()=>{map.invalidateSize(true);scheduleMapFetch(120)},320));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>{map.invalidateSize(true);loadCompanies(true)},150)});
function toggleSearch(){
  const box=$('searchBox');
  box.style.display=box.style.display==='block'?'none':'block';
  if(box.style.display==='block')$('searchInput').focus();
}
$('searchInput').addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    lastFetchKey='';
    loadCompanies(true);
  },250);
});
function applyFilters(){
  filters={
    type:$('filterType').value,
    manufacturer:$('filterManufacturer').value.trim(),
    vendor:$('filterVendor').value.trim(),
    presence:$('filterPresence').value,
    acquisition:$('filterAcquisition').value
  };
  lastFetchKey='';
  closePanel('filterPanel');
  loadCompanies(true);
}
function clearFilters(){
  filters={type:'all',manufacturer:'',vendor:'',presence:'',acquisition:''};
  $('filterType').value='all';
  $('filterManufacturer').value='';
  $('filterVendor').value='';
  $('filterPresence').value='';
  $('filterAcquisition').value='';
  lastFetchKey='';
  closePanel('filterPanel');
  loadCompanies(true);
}
function buildEquip(){const root=$('equipRoot');root.innerHTML='';Object.entries(EQUIP).forEach(([k,c])=>root.insertAdjacentHTML('beforeend',`<div class="section"><b>${c.label}</b>${c.presence?`<div class="field"><label>有無</label><select id="${k}_presence"><option>有り</option><option>無し</option></select></div>`:''}<div class="grid"><div class="field"><label>メーカー</label><select id="${k}_manufacturer"><option></option>${c.manufacturers.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>型式</label><input id="${k}_model"></div></div><div class="field"><label>その他メーカー名</label><input id="${k}_custom"></div><div class="field"><label>販売店</label><input id="${k}_vendor"></div><div class="grid"><div class="field"><label>リース/買取</label><select id="${k}_acq"><option></option><option>リース</option><option>買取</option></select></div><div class="field"><label>リース開始年月</label><input id="${k}_lease" type="month"></div></div><div class="field"><label>契約年数</label><input id="${k}_years"></div></div>`))}
function readEq(k){return{presence:EQUIP[k].presence?$(k+'_presence').value:'',manufacturer:$(k+'_manufacturer').value,custom_manufacturer:$(k+'_custom').value.trim(),model:$(k+'_model').value.trim(),vendor:$(k+'_vendor').value.trim(),acquisition:$(k+'_acq').value,lease_start:$(k+'_lease').value,contract_years:$(k+'_years').value.trim()}}
function fillEq(k,e={}){if(EQUIP[k].presence)$(k+'_presence').value=e.presence||'有り';$(k+'_manufacturer').value=e.manufacturer||'';$(k+'_custom').value=e.custom_manufacturer||'';$(k+'_model').value=e.model||'';$(k+'_vendor').value=e.vendor||'';$(k+'_acq').value=e.acquisition||'';$(k+'_lease').value=e.lease_start||'';$(k+'_years').value=e.contract_years||''}
function resetForm(){['editId','fName','fIndustry','fAddress','fPresident','fPresidentMobile','fPhone','fStaff','fDate','fNeta','fNext','fLat','fLng'].forEach(i=>$(i).value='');$('fCategory').value=activeCategory;$('fStatus').value='未訪問';Object.keys(EQUIP).forEach(k=>fillEq(k,{}))}
function openForm(){resetForm();$('deleteBtn').classList.add('hidden');openPanel('formPanel')}
async function editCompany(id){let c=companies.find(x=>String(x.id)===String(id));if(!c){const {data}=await sb.from('sales_accounts').select('*').eq('id',id).single();c=data}if(!c)return;$('editId').value=c.id;$('fCategory').value=c.category;$('fName').value=c.name||'';$('fIndustry').value=c.industry||'';$('fAddress').value=c.address||'';$('fPresident').value=c.president_name||'';$('fPresidentMobile').value=c.president_mobile||'';$('fPhone').value=c.phone||'';$('fStaff').value=c.staff||'';$('fStatus').value=c.status||'未訪問';$('fDate').value=c.last_visit_date||'';$('fNeta').value=c.sales_note||'';$('fNext').value=c.next_action||'';$('fLat').value=c.lat??'';$('fLng').value=c.lng??'';Object.keys(EQUIP).forEach(k=>fillEq(k,c[k]||{}));$('deleteBtn').classList.remove('hidden');openPanel('formPanel')} window.editCompany=editCompany;
async function geocode(a){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(a));const d=await r.json();return d?.[0]?{lat:+d[0].lat,lng:+d[0].lon}:null}
async function saveCompany(){const name=$('fName').value.trim(),address=$('fAddress').value.trim();if(!name)return alert('会社名を入力してください');let lat=parseFloat($('fLat').value),lng=parseFloat($('fLng').value);if((!Number.isFinite(lat)||!Number.isFinite(lng))&&address){const p=await geocode(address);if(!p)return alert('住所から位置を取得できません');lat=p.lat;lng=p.lng}const p={category:$('fCategory').value,name,address,lat,lng,industry:$('fIndustry').value.trim(),president_name:$('fPresident').value.trim(),president_mobile:$('fPresidentMobile').value.trim(),phone:$('fPhone').value.trim(),staff:$('fStaff').value.trim(),status:$('fStatus').value,last_visit_date:$('fDate').value||null,sales_note:$('fNeta').value.trim(),next_action:$('fNext').value.trim(),updated_by:session.user.id};Object.keys(EQUIP).forEach(k=>p[k]=readEq(k));const id=$('editId').value;let res;if(id)res=await sb.from('sales_accounts').update(p).eq('id',id);else{p.created_by=session.user.id;res=await sb.from('sales_accounts').insert(p)}if(res.error)return alert(res.error.message);activeCategory=p.category;closePanel('formPanel');await setCategory(activeCategory)}
async function deleteCurrent(){const id=$('editId').value;if(id&&confirm('削除しますか？'))await sb.from('sales_accounts').delete().eq('id',id);closePanel('formPanel');await loadCompanies(true)}

async function locateMe(){navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16),()=>alert('現在地を取得できません'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function openManage(){$('manageList').innerHTML=rows().map(c=>`<label class="manage-row"><input type="checkbox" class="del" value="${c.id}"><div><b>${esc(c.name)}</b><div class="tiny">${esc(c.address||'')}</div></div></label>`).join('');openPanel('managePanel')}
async function deleteSelected(){const ids=[...document.querySelectorAll('.del:checked')].map(x=>x.value);if(!ids.length)return alert('選択してください');if(confirm(`${ids.length}件削除しますか？`)){await sb.from('sales_accounts').delete().in('id',ids);await loadCompanies(true);openManage()}}
async function deleteAll(){if(profile.role!=='admin')return alert('管理者のみ');if(confirm('全データ削除しますか？')&&confirm('最終確認です')){await sb.from('sales_accounts').delete().gte('id',0);await loadCompanies(true);closePanel('managePanel')}}

async function openAccount(){$('accountMe').innerHTML=`<b>${esc(profile.display_name||'')}</b><br><span class="tiny">${esc(profile.email||'')} / ${profile.role==='admin'?'管理者':'一般'}</span>`;$('adminArea').classList.toggle('hidden',profile.role!=='admin');if(profile.role==='admin')await loadProfiles();openPanel('accountPanel')}
async function loadProfiles(){const {data}=await sb.from('profiles').select('*').order('created_at');$('profilesList').innerHTML=(data||[]).map(p=>`<div class="account-row"><b>${esc(p.display_name||'-')}</b><br><span class="tiny">${esc(p.email||'')} / ${p.role==='admin'?'管理者':'一般'}</span></div>`).join('')}
async function createUser(){const body={display_name:$('newName').value.trim(),email:$('newEmail').value.trim(),password:$('newPass').value,role:$('newRole').value};if(!body.email||body.password.length<8)return alert('メールと8文字以上のパスワードが必要です');const {data,error}=await sb.functions.invoke('create-ic-user',{body});if(error||data?.error)return alert(data?.error||error.message);alert('追加しました');await loadProfiles()}

function toExcel(c){const r={会社名:c.name,住所:c.address,業種:c.industry,社長名:c.president_name,社長携帯:c.president_mobile,会社電話:c.phone,担当者:c.staff,ステータス:c.status,最終訪問日:c.last_visit_date||'',営業ネタ:c.sales_note,次回アクション:c.next_action,緯度:c.lat,経度:c.lng};Object.entries(EQUIP).forEach(([k,v])=>{const e=c[k]||{},p=v.label;if(v.presence)r[p+'有無']=e.presence||'';r[p+'メーカー']=e.manufacturer==='その他'?(e.custom_manufacturer||'その他'):(e.manufacturer||'');r[p+'型式']=e.model||'';r[p+'販売店']=e.vendor||'';r[p+'契約']=e.acquisition||'';r[p+'リース開始']=e.lease_start||'';r[p+'契約年数']=e.contract_years||''});return r}
async function exportExcel(){
  const {data,error}=await sb.from('sales_accounts').select('*').order('category').order('updated_at',{ascending:false});
  if(error)return alert('Excel出力エラー：'+error.message);
  const all=data||[],wb=XLSX.utils.book_new();
  ['飛び込みリスト','見込','顧客'].forEach(cat=>{
    const rr=all.filter(c=>c.category===cat).map(toExcel);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rr.length?rr:[{'会社名':'','住所':''}]),cat);
  });
  XLSX.writeFile(wb,'株式会社IC_共有営業管理.xlsx');
}
function downloadTemplate(){const wb=XLSX.utils.book_new();['飛び込みリスト','見込','顧客'].forEach(cat=>{const r={会社名:'',住所:'',業種:'',社長名:'',社長携帯:'',会社電話:'',担当者:'',ステータス:'未訪問',最終訪問日:'',営業ネタ:'',次回アクション:''};Object.values(EQUIP).forEach(v=>{if(v.presence)r[v.label+'有無']='';r[v.label+'メーカー']='';r[v.label+'型式']='';r[v.label+'販売店']='';r[v.label+'契約']='';r[v.label+'リース開始']='';r[v.label+'契約年数']=''});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([r]),cat)});XLSX.writeFile(wb,'株式会社IC_共有営業管理_ひな形.xlsx')}

init();
</script>
</body></html>
